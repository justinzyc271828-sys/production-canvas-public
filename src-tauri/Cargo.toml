[package]
name = "production-canvas"
version = "1.6.0"
edition = "2024"
rust-version = "1.89"

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
tauri = { version = "=2.11.5", default-features = false, features = ["wry", "common-controls-v6", "unstable"] }
serde_json = "1"
base64 = "0.22"
rfd = { version = "=0.16.0", default-features = false }
sha2 = "0.10"
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com_StructuredStorage"] }

[profile.release]
strip = true
