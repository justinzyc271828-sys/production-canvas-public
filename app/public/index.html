<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'">
<title>制作画布</title>
<link rel="stylesheet" href="./canvas.css">
<script src="./canvas-ui.js" defer></script>
<script src="./note-location.js" defer></script>
<script src="./review-timeline.js" defer></script>
</head>
<body>
<main>
  <div id="workspace" hidden>
    <header class="toolbar">
      <div class="project-group">
        <button id="project-menu" class="brand" type="button" aria-label="项目菜单">▣　制作画布</button><span class="slash">/</span>
        <h1 id="title" class="sr-only">制作画布</h1>
        <select id="project" aria-label="当前项目"></select><span class="slash">/</span>
        <select id="review-version" aria-label="审片版本"></select>
        <span id="film-summary" class="hint"></span>
      </div>
      <nav aria-label="项目模式">
        <button id="return-review" type="button" aria-pressed="true"><canvas id="return-frame" width="64" height="36" hidden></canvas><span id="return-label">审片</span></button>
        <button id="comfy-canvas" type="button" aria-pressed="false" hidden>ComfyUI 画布</button>
      </nav>
    </header>
    <div id="comfy-status" hidden><span id="graph-info"></span><button id="retry-comfy" type="button" hidden>重试</button></div>
    <div class="screen" id="review">
      <section class="monitor" aria-label="审片">
        <div id="player" tabindex="-1"></div>
        <div class="player-bar">
          <div class="clock"><strong id="play-time">00:00.00</strong><span id="total-time"></span><span id="frame-number"></span></div>
          <div class="transport">
            <button id="prev-cut" type="button" aria-label="上一个剪辑点">|◀</button>
            <button id="prev-frame" type="button" aria-label="后退一帧">‹</button>
            <button id="play-toggle" class="primary" type="button" aria-label="播放">▶</button>
            <button id="next-frame" type="button" aria-label="前进一帧">›</button>
            <button id="next-cut" type="button" aria-label="下一个剪辑点">▶|</button>
          </div>
          <div class="player-actions">
            <button id="loop-shot" type="button" aria-pressed="false" disabled>↻ 循环本镜</button>
            <button id="speed" type="button" aria-label="播放速度">1×</button>
            <button id="mute" type="button" aria-label="静音" aria-pressed="false">音量</button>
            <button id="note-at-time" type="button" disabled>记指令</button>
            <button id="inspect-toggle" type="button" aria-controls="clip-panel">检查</button>
          </div>
        </div>
        <form id="quick-note" class="quick-note row" hidden>
          <label id="inline-note-label" for="inline-note">记指令</label>
          <input id="inline-note" required maxlength="16000" placeholder="写一句指令，Enter 保存，Esc 放弃">
          <button type="submit">保存</button>
          <button id="detail-note" type="button">展开写详细</button>
          <button id="retarget-note" type="button" hidden>改记到当前帧</button>
        </form>
      </section>
      <aside class="inspector" id="clip-panel" aria-label="检查器">
        <button id="close-inspector" type="button" hidden>‹ 本版概况</button>
        <div id="inspector"></div>
        <div id="markers" class="row"></div>
        <div class="inspector-tools row">
          <button type="button" id="screening" hidden>连续审片</button>
          <button type="button" data-panel="materials">素材</button>
          <button type="button" data-panel="direction">导演指令</button>
          <button type="button" id="toggle-engine" data-panel="engineering">工程</button>
        </div>
      </aside>
    </div>
    <section class="timeline" id="edit" aria-label="时间线">
      <div class="timeline-tools">
        <div class="control-group" aria-label="缩放预设">
          <button id="zoom-full" type="button">全片</button><button id="zoom-act" type="button">本幕</button><button id="zoom-selection" type="button">选中</button>
        </div>
        <button id="zoom-out" type="button" aria-label="缩小">−</button><button id="zoom-in" type="button" aria-label="放大">＋</button>
        <span id="timeline-range" class="hint"></span>
        <span class="spacer"></span>
        <label id="track-filter" hidden><input id="active-tracks" type="checkbox">只看有片段的轨道</label>
        <div class="control-group" aria-label="刻度">
          <button id="ruler-time" type="button" aria-pressed="true">时间</button><button id="ruler-bars" type="button" aria-pressed="false">小节</button>
        </div>
        <div class="control-group" aria-label="时间线高度">
          <button id="collapse-tracks" type="button">收起</button><button id="standard-tracks" type="button">标准</button><button id="expand-tracks" type="button">展开</button>
        </div>
      </div>
      <div id="overview"></div>
      <div id="review-rows"></div>
      <div class="timeline-scroll" id="timeline-scroll" tabindex="0" aria-label="Kdenlive 工程轨"><div id="tracks"></div></div>
    </section>
    <dialog id="side-panel" aria-labelledby="panel-title">
      <div class="dialog-shell">
        <header class="section-head"><h2 id="panel-title"></h2><button type="button" id="close-panel">关闭</button></header>
        <div class="dialog-content">
          <p id="panel-status" class="notice" role="status" hidden></p>
          <section id="materials" hidden>
            <a id="storyboard" target="_blank" rel="noopener">打开分镜资料</a>
            <div class="assets" id="assets"></div>
          </section>
          <section id="direction" hidden>
            <details id="new-brief"><summary>新建指令或粘贴讨论</summary>
              <form id="brief">
                <div class="form-row"><label>简短标题<input name="title" required maxlength="100" placeholder="例如：调整 3-05 的停顿"></label><label>执行路线<select name="route" required></select></label></div>
                <label>对象<input name="target" required maxlength="120" placeholder="S03、镜头编号或素材"></label>
                <label>指令／讨论原文<textarea name="text" required maxlength="16000" rows="4" placeholder="例如：这里再停半秒。"></textarea></label>
                <button class="primary" type="submit">保存指令</button>
              </form>
            </details>
            <div id="tasks" class="items"></div>
          </section>
          <section id="engineering" hidden>
            <div id="bindings"></div>
            <div class="section-head jobs-header"><h3>本地任务</h3><button id="run-references" type="button">取三机位参考图</button></div>
            <div id="jobs" class="items"></div>
          </section>
        </div>
      </div>
    </dialog>
  </div>
  <div id="status" class="notice" role="status" aria-live="polite">正在读取项目记录…</div>
</main>
</body>
</html>
