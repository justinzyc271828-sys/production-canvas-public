name: Verify Production Canvas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run verify:sample
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: windows-sample-verification
          path: release/sample-verification/
          if-no-files-found: ignore
          retention-days: 7
